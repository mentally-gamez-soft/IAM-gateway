[project]
name = "iam-gateway"
version = "0.1.0"
description = "A Gateway API IAM in Flask."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15.2",
    "arrow>=1.3.0",
    "deprecated>=1.2.18",
    "dotenv>=0.9.9",
    "email-validator~=2.2.0",
    "flask~=3.1.0",
    "flask-login~=0.6.3",
    "flask-mail~=0.10.0",
    "flask-migrate~=4.1.0",
    "flask-sqlalchemy~=3.1.1",
    "flask-swagger-ui>=5.21.0",
    "flask-limiter[redis]>=3.5.0",
    "flask-wtf~=1.2.2",
    "pre-commit>=4.2.0",
    "redis>=5.0.0",
    "psycopg2~=2.9.10",
    "pybreaker>=1.3.0",
    "pyjwt>=2.10.1",
    "python-slugify~=8.0.4",
    "python-usernames>=1.0.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.40",
    "tenacity>=9.1.2",
]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | Docker
  | build-run-commands
)/
'''

[tool.isort]
profile = "black"
line_length = 79
