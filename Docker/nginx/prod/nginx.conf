upstream iam_gateway_network {
    server iam_gateway_container:5012;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://iam_gateway_network;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host "localhost";
        proxy_redirect off;
    }
}